				$("#messageArea").on("submit", function(event) {
					const date = new Date();
					const hour = date.getHours();
					const minute = date.getMinutes();
					const str_time = hour+":"+(minute<10?"0"+minute:minute);
					var rawText = $("#text").val();
                    console.log(rawText)
					// var userHtml = '<div class="d-flex justify-content-end mb-4"><div class="msg_cotainer_send">' + rawText + '<span class="msg_time_send">' + str_time + '</span></div><div class="img_cont_msg"><img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="rounded-circle user_img_msg"><button type="button" class="speaker_btn"><i class="fas fa-volume-up"></i></button></div></div>';

						$("#is-typing").remove();
						$("#messageFormeight").append($.parseHTML(botHtml));

						$("#messageFormeight").append($.parseHTML(botHtml));
